
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Batchwise — Next week's batch projection</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="./style.css">

  <!-- External JavaScript -->
  <script src="./script.js" defer></script>
</head>

<body>
  <main>
    <header>
      <h1>Batchwise <small>· next week's batch projection</small></h1>
      <span class="badge">MongoDB data</span>
    </header>

    <div class="row toolbar">
      <label for="sel" class="mut">Product &amp; week</label>
      <select id="sel"></select>
      <button id="reset">Reset saved plans</button>
    </div>

    <!-- JavaScript renders the product information here -->
    <div id="app"></div>

    <p class="mut">
      Beverages, sales, and feedback are read from MongoDB.
      Plans are saved there too.
      Captions are drafts only; nothing is posted automatically.
    </p>
  </main>

  <!-- Seller assistant -->
  <button
    class="fab"
    id="chatfab"
    aria-expanded="false"
    aria-controls="chat"
  >
    💬 Ask assistant
  </button>

  <section
    class="chatpanel"
    id="chat"
    hidden
    role="dialog"
    aria-label="Seller assistant"
  >
    <div class="chathead">
      <b>Seller assistant</b>
      <span class="mut">Gemini AI · MongoDB data</span>
      <button id="chatclose" aria-label="Hide assistant">✕</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="chatlog" id="chatlog" aria-live="polite"></div>

    <div class="row">
      <input
        id="chatin"
        placeholder="Ask about your batch, feedback, or promotion…"
        aria-label="Message to assistant"
      >
      <button class="p" id="chatsend">Send</button>
    </div>

    <p class="mut chatnote" id="chatnote">
      The assistant can be wrong. The batch decision stays yours.
    </p>
  </section>
</body>
</html>
